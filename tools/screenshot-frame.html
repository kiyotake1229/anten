<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暗転 スクリーンショット台紙</title>
<!-- App Store 用スクリーンショットの台紙。tools/make-screenshots.mjs が開いて撮影する（手で開いても見られる: ?iw=402&ih=786&scene=dark） -->
<style>
  :root { --paper: #F3EFE6; --paper2: #E6E0D4; --ink: #15161A; --ink2: #3A3C44; --ink3: #8A8C94; --dark: #07080C; --cyan: #5BE8FF; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; display: flex; flex-direction: column; align-items: center; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background-image: linear-gradient(var(--paper2) 1px, transparent 1px), linear-gradient(90deg, var(--paper2) 1px, transparent 1px); background-size: 40px 40px; }
  body.night { background: var(--dark); color: var(--paper); background-image: none; }
  .cap { text-align: center; padding: 0 7vw; box-sizing: border-box; width: 100%; }
  .cap h1 { margin: 0; font-weight: 800; line-height: 1.35; letter-spacing: .08em; word-break: keep-all; overflow-wrap: anywhere; }
  .cap p { margin: .6em 0 0; color: var(--ink2); letter-spacing: .08em; word-break: keep-all; overflow-wrap: anywhere; font-weight: 600; }
  body.night .cap p { color: var(--cyan); }
  .device { position: relative; overflow: hidden; background: var(--paper); box-shadow: 0 40px 90px -30px rgba(0,0,0,.6), 0 0 0 1px rgba(21,22,26,.12); }
  body.night .device { box-shadow: 0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(243,239,230,.18); }
  .device iframe { border: 0; display: block; transform-origin: 0 0; }
</style>
</head>
<body>
<div class="cap"><h1 id="h"></h1><p id="p"></p></div>
<div class="device" id="dev"><iframe id="app" title="暗転"></iframe></div>
<script>
const q = new URLSearchParams(location.search);
const iw = +q.get('iw') || 402, ih = +q.get('ih') || 786; // アプリの表示領域（その端末での CSS ピクセル）
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 撮影用の保存データ。音は消しておく。ヒントは初回のまま（画面に説明が出る）
function seedState(extra) {
  return Object.assign({ v: 1, best: 0, totalRows: 0, totalPlays: 0, tier: 0, dailyHistory: [],
    settings: { sound: false, vibe: false, gain: 1.6, notify: false, contrast: false, slow: false } }, extra);
}

// アプリの中を操作する道具（iframe の中の __anten とタッチの合成）
function tools(win) {
  const a = win.__anten, doc = win.document, cv = doc.getElementById('c');
  const ev = (t, x, y) => cv.dispatchEvent(new win.PointerEvent(t, { clientX: x, clientY: y || ih * .75, pointerId: 7, pointerType: 'touch', isPrimary: true, bubbles: true, cancelable: true, button: 0 }));
  const untilRows = (k) => { let n = 0; while (a.G.passed < k && a.state === 2 && n < 4000) { a.advance(.05); n++; } };
  return { a, doc, ev, untilRows,
    start() { ev('pointerdown', iw * .5); a.advance(.05); ev('pointerup', iw * .5); a.advance(.3); },
    bot(on) { if (a.toggleBot() !== on) a.toggleBot(); },
    tapResult() { a.advance(.6); doc.getElementById('result').dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 9, pointerType: 'touch', isPrimary: true, clientX: iw * .5, clientY: ih * .9 })); a.advance(.5); },
  };
}

const SCENES = {
  title: { h: '触ると動ける。でも見えない', p: '見るか動くかを、親指ひとつで', run: async T => { T.a.advance(.5); } },
  open: { h: '離すと見える。でも動けない', p: '隙間を読んで、また閉じる',
    run: async T => { T.start(); T.bot(true); T.untilRows(9); T.bot(false); T.a.advance(.25); } },
  dark: { h: '閉じたまま抜けると +2 +3 +4 +5', p: '残像と音だけが頼り', night: true,
    run: async T => { T.start(); T.bot(true); T.untilRows(6); T.bot(false); T.a.advance(.2); T.ev('pointerdown', iw * .5); T.a.advance(.2); T.ev('pointermove', iw * .5 - 22); T.a.advance(.1); } },
  result: { h: '段位が上がり、熾火の色が変わる', p: 'タップ2回で、もう一回',
    run: async T => { T.start(); T.bot(true); T.untilRows(41); T.bot(false); T.a.player.tx = 12; let n = 0; while (T.a.state === 2 && n < 200) { T.a.advance(.05); n++; } T.a.advance(1.2); } },
  daily: { h: '今日の暗転は、1日3回だけ', p: '自己ベストの軌跡と走る',
    seed: { best: 57, totalRows: 430, totalPlays: 12, tier: 2, hints: { firstTouch: 3, dark: 1, squint: 1, shinobi: 3, cancel: 0, double: 3, mirror: 3 } },
    run: async T => { T.doc.getElementById('tDaily').click(); T.a.advance(.3); T.start(); T.bot(true); T.untilRows(24); T.bot(false); T.a.player.tx = 12; let n = 0; while (T.a.state === 2 && n < 200) { T.a.advance(.05); n++; } T.a.advance(1); T.tapResult(); T.start(); T.bot(true); T.untilRows(7); T.bot(false); T.a.advance(.15); } },
};

function layout() {
  const W = innerWidth, H = innerHeight, base = Math.min(W * 0.064, H * 0.031);
  const cap = document.querySelector('.cap');
  cap.style.paddingTop = (H * 0.055) + 'px';
  document.getElementById('h').style.fontSize = base + 'px';
  document.getElementById('p').style.fontSize = (base * 0.52) + 'px';
  const top = cap.getBoundingClientRect().bottom + H * 0.035;
  const avail = H - top, scale = Math.min((W * 0.86) / iw, avail / ih);
  const dev = document.getElementById('dev'), f = document.getElementById('app');
  dev.style.width = (iw * scale) + 'px'; dev.style.height = (ih * scale) + 'px'; dev.style.borderRadius = (iw * scale * 0.085) + 'px';
  f.style.width = iw + 'px'; f.style.height = ih + 'px'; f.style.transform = `scale(${scale})`;
}

// make-screenshots.mjs から呼ぶ。場面を仕込んで撮れる状態にする
window.setupScene = async function (name) {
  const sc = SCENES[name]; if (!sc) throw new Error('unknown scene ' + name);
  document.getElementById('h').textContent = sc.h; document.getElementById('p').textContent = sc.p;
  document.body.classList.toggle('night', !!sc.night);
  layout();
  localStorage.setItem('anten.v1', JSON.stringify(seedState(sc.seed)));
  const f = document.getElementById('app');
  await new Promise(r => { f.onload = r; f.src = '../index.html'; });
  await sleep(300);
  const win = f.contentWindow;
  for (let i = 0; i < 50 && !win.__anten; i++) await sleep(50);
  const T = tools(win);
  // 実時間の描画ループを止め、__anten.advance() だけで進める（待っている間にゲームが進んで死なないように）
  win.requestAnimationFrame = () => 0; await sleep(80);
  await sc.run(T);
  T.doc.getElementById('toasts').innerHTML = ''; // 操作の途中で出たトーストは消してから撮る
  await sleep(700); // タイトルの消える動き（CSS の 0.35 秒）が終わるのを待つ
  return { scene: name, state: T.a.state, score: T.a.G.score, eye: T.a.eye.mode };
};
if (q.get('scene')) setupScene(q.get('scene'));
</script>
</body>
</html>
